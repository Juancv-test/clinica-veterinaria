# ===================================================
#  Propiedades exclusivas para pruebas (JUnit).
#  Sobrescriben application.properties en el classpath de test.
#  NOTA: Este archivo no debe contener secretos de producción.
#  Las contraseñas aquí son solo para el entorno local de desarrollo.
# ===================================================

# Base de datos: usa env var con fallback al valor local de desarrollo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/veterinaria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}

# No re-ejecutar schema/data en cada test (ya existe de la ejecución real)
spring.sql.init.mode=never

# JWT con valores fijos para test (mínimo 32 caracteres para HS256)
jwt.secret=TestSecretKeyAtLeast32CharsForJwtHmacSha256!
jwt.expiration-ms=3600000

# Contraseña del admin solo para pruebas
admin.password=TestAdmin123!
