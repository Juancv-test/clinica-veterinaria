# =============================================
#  Clínica Veterinaria - Configuración de la app
#  Las credenciales NUNCA van escritas aquí;
#  se leen de variables de entorno del sistema.
# =============================================

spring.application.name=clinica

# --- Servidor ---
server.port=8080

# --- Base de datos PostgreSQL ---
# DB_URL y DB_USER tienen valores por defecto seguros.
# DB_PASSWORD NO tiene default: la app falla si no se define (correcto).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/veterinaria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

# --- Inicialización SQL ---
# 'always' ejecuta schema.sql y data.sql en cada arranque.
# El SQL es idempotente (IF NOT EXISTS / ON CONFLICT DO NOTHING).
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# --- JWT ---
# jwt.secret: mínimo 32 caracteres, viene de variable de entorno JWT_SECRET
# jwt.expiration-ms: 7 200 000 ms = 2 horas
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=7200000

# --- Usuario administrador inicial ---
# Se crea en el CommandLineRunner solo si no existe.
# Viene de variable de entorno ADMIN_PASSWORD.
admin.password=${ADMIN_PASSWORD}

# --- Logging ---
logging.level.com.veterinaria=DEBUG
logging.level.org.springframework.security=INFO
