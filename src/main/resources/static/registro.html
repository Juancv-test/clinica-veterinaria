<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Veterinaria - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 mb-5">
    <div class="card">
        <div class="card-header"><h4>Registro de Cliente y Mascota</h4></div>
        <div class="card-body">
            <form id="registroForm">
                <h5>Datos Personales</h5>
                <div class="row mb-3">
                    <div class="col"><input type="text" id="nombres" class="form-control" placeholder="Nombres" required></div>
                    <div class="col"><input type="text" id="apellidos" class="form-control" placeholder="Apellidos" required></div>
                </div>
                <div class="row mb-3">
                    <div class="col"><input type="text" id="dni" class="form-control" placeholder="DNI (8 dígitos)" required></div>
                    <div class="col"><input type="email" id="email" class="form-control" placeholder="Email" required></div>
                </div>
                <div class="row mb-3">
                    <div class="col"><input type="password" id="password" class="form-control" placeholder="Contraseña" required></div>
                </div>

                <hr>
                <h5>Datos de la Mascota</h5>
                <div class="row mb-3">
                    <div class="col"><input type="text" id="m_nombre" class="form-control" placeholder="Nombre de la mascota" required></div>
                    <div class="col"><input type="text" id="m_especie" class="form-control" placeholder="Especie (Perro, Gato...)" required></div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <select id="m_sexo" class="form-control" required>
                            <option value="">Seleccione sexo...</option>
                            <option value="M">Macho</option>
                            <option value="H">Hembra</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-success">Registrar</button>
                <a href="index.html" class="btn btn-link">Volver al login</a>
            </form>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Armar el DTO complejo que pide Spring Boot (RegistroClienteDto)
        const payload = {
            cliente: {
                nombres: document.getElementById('nombres').value,
                apellidos: document.getElementById('apellidos').value,
                dni: document.getElementById('dni').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            },
            mascota: {
                nombre: document.getElementById('m_nombre').value,
                especie: document.getElementById('m_especie').value,
                sexo: document.getElementById('m_sexo').value
            }
        };

        try {
            await api.post('/auth/registro', payload);
            alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
            window.location.href = 'index.html';
        } catch (error) {
            // El alert ya sale por api.js
        }
    });
</script>
</body>
</html>
