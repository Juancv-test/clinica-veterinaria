<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Veterinaria - Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand" id="panelTitulo">Panel</span>
        <button class="btn btn-danger btn-sm" onclick="logout()">Cerrar Sesión</button>
    </div>
</nav>

<div class="container mt-4">
    <div class="alert alert-success">
        <h4 id="bienvenida">Bienvenido</h4>
        <p>Tu registro fue exitoso. (Las funciones detalladas del cliente se implementarán en el siguiente avance).</p>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    const rol = localStorage.getItem('rol');
    if (!localStorage.getItem('token') || rol === 'ADMIN') {
        window.location.href = 'index.html';
    }
    
    const bienvenidaTexto = {
        'CLIENTE': 'Bienvenido, ',
        'VETERINARIO': 'Bienvenido, Veterinario/a ',
        'RECEPCIONISTA': 'Bienvenido, Recepcionista '
    };
    const tituloPanel = {
        'CLIENTE': 'Panel de Cliente',
        'VETERINARIO': 'Panel de Veterinario',
        'RECEPCIONISTA': 'Panel de Recepcionista'
    };
    document.getElementById('panelTitulo').innerText = tituloPanel[rol] || 'Panel';
    document.getElementById('bienvenida').innerText = 
        (bienvenidaTexto[rol] || 'Bienvenido, ') + localStorage.getItem('nombre');
</script>
</body>
</html>
